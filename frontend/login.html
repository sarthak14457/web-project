<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>InventoryIQ — Log In</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <div class="card">
    <div class="brand">
      <h1>Stock Ledger</h1>
      <div class="sub">Log in to manage your inventory</div>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <div class="error" id="errorMsg">Enter a valid email and password.</div>
      <button type="submit">Log in</button>
      <div class="success" id="successMsg">Logged in — redirecting to your inventory...</div>
    </form>

    <div class="foot">
      No account yet? <a href="signup.html">Sign up</a>
    </div>
  </div>

  <script src="login.js">
  </script>

</body>

</html>
