<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>InventoryIQ — Inventory</title>
  <link rel="stylesheet" href="inventory.css">

</head>

<body>
  <div class="wrap">

    <header>
      <div>
        <h1>InventoryIQ</h1>
        <div class="sub">Inventory on hand</div>
      </div>
      <div class="stats">
        <div>Items<span id="statItems">0</span></div>
        <div>Units<span id="statUnits">0</span></div>
        <div>Low stock<span id="statLow">0</span></div>
      </div>
    </header>

    <nav style="margin:-14px 0 20px; text-align:right;">
      <a id="adminLink" href="admin.html"
        style="color:var(--muted); text-decoration:none; font-size:12px; text-transform:uppercase; letter-spacing:.5px;">Admin</a>
      <a href="login.html"
        style="color:var(--muted); text-decoration:none; font-size:12px; text-transform:uppercase; letter-spacing:.5px; margin-left:14px;">Log
        out</a>
    </nav>

    <div class="panel">
      <form id="addForm">
        <div>
          <label for="name">Item name</label>
          <input type="text" id="name" required placeholder="e.g. Blue notebook">
        </div>
        <div>
          <label for="qty">Quantity</label>
          <input type="number" id="qty" min="0" required placeholder="0">
        </div>
        <div>
          <label for="threshold">Low-stock at</label>
          <input type="number" id="threshold" min="0" placeholder="5">
        </div>
        <div>
          <label for="price">Unit price</label>
          <input type="number" id="price" min="0" step="0.01" placeholder="0.00">
        </div>
        <div>
          <label for="supplier">Supplier</label>
          <select id="supplier">
            <option value="">— none —</option>
          </select>
        </div>
        <button type="submit" class="btn-add">Add item</button>
      </form>
    </div>

    <div class="panel">
      <div class="toolbar">
        <span class="sub" style="color:var(--muted); font-size:11px;">Click any field to edit it</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th class="num">Qty</th>
            <th class="num">Threshold</th>
            <th class="num">Price</th>
            <th class="num">Value</th>
            <th>Supplier</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="emptyMsg" class="empty" style="display:none;">No items yet — add your first item above.</div>
    </div>

    <footer>Data is stored in the database via the backend API.</footer>
  </div>

  <script src="inventory.js"></script>
</body>

</html>
